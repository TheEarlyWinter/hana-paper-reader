name: V2 Candidate Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Read V2 App version
        id: version
        shell: pwsh
        run: |
          $taskManifest = Get-Content -LiteralPath apps/hana-paper-reader/manifest.json -Raw | ConvertFrom-Json
          if ($taskManifest.manifestVersion -ne 2 -or $taskManifest.id -ne 'hana-paper-reader') { throw 'Expected the V2 App manifest' }
          $taskVersion = [string]$taskManifest.version
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid App version' }
          "version=$taskVersion" >> $env:GITHUB_OUTPUT

      - name: Prepare V2 candidate archives
        shell: pwsh
        run: ./tools/package-candidate.ps1 -OutputDirectory ./dist/v2-packages -StagingDirectory ./dist/v2-staging

      - name: Check candidate structure and write SHA256
        shell: pwsh
        env:
          HANA_SOURCE_COMMIT: ${{ github.sha }}
        run: ./tools/verify-candidate-packages.ps1 -OutputDirectory ./dist/v2-packages

      - name: Upload candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: hana-paper-reader-v2-${{ steps.version.outputs.version }}-candidates
          if-no-files-found: error
          path: |
            dist/v2-packages/*.zip
            dist/v2-packages/SHA256SUMS.txt
            dist/v2-packages/CANDIDATE-PACKAGE-REPORT.json
